function acceptReferral(refId) {
  const r = data.referrals.find(x => x.id === refId);
  if (!r) return;

  // Create case with EHR-sourced context already populated
  const c = buildCase(
    r.donorName.replace(/Donor \(/, "Donor — ").replace(/\)$/, ""),
    r.riskHint,
    r.riskHint === "High" ? "Rapid" : "Pending",
    1,  // skip Intake — referral provided structured intake
    0,
    [`Auto-imported from ${r.ehr}`, "FHIR R4 bundle"],
    {
      hospital:  r.hospital,
      center:    "—",
      organType: r.organCandidates[0],
      ehrSource: r.ehr,
      donorType: r.triggerType.includes("Cardiac arrest") ? "DCD" : "DBD"
    }
  );

  // Mark Intake stage complete since it was filled by referral
  c.workflowSteps[0].status = "complete";
  c.workflowSteps[0].completedAt = Date.now();
  c.workflowSteps[0].checklist.forEach(item => item.done = true);
  c.currentStageIdx = 1;
  c.workflowSteps[1].status = "current";

  // Seed audit chain
  let prevHash = "0".repeat(12);
  const seedHash = pseudoHash((r.receivedAt ^ c.id) >>> 0);
  c.auditChain.push({
    seq: 1,
    t: r.receivedAt,
    actor: `${r.ehr} EHR`,
    action: `FHIR Bundle received · ${r.bundleSize}`,
    severity: "info",
    prevHash,
    hash: seedHash
  });
  prevHash = seedHash;
  const openHash = pseudoHash((Date.now() ^ c.id) >>> 0);
  c.auditChain.push({
    seq: 2,
    t: Date.now(),
    actor: "Coordinator",
    action: `Referral ${r.id} accepted · case opened`,
    severity: "info",
    prevHash,
    hash: openHash
  });

  c.events.push({ t: r.receivedAt, text: `FHIR bundle received from ${r.ehr} · ${r.bundleSize}`, severity: "info" });
  c.events.push({ t: Date.now(),    text: `Referral ${r.id} accepted · case opened`, severity: "complete" });

  addCaseInsight(c,
    `Auto-imported from ${r.ehr}. Intake stage complete. Athena assessing ${r.riskHint.toLowerCase()}-risk profile across ${r.organCandidates.length} candidate organs.`,
    r.riskHint === "High" ? "critical" : "info"
  );

  data.cases.push(c);
  r.status = "accepted";
  navigate("case-detail", c.id);
}

function dismissReferral(refId) {
  const r = data.referrals.find(x => x.id === refId);
  if (!r) return;
  r.status = "dismissed";
  renderReferralTab("new");
}

function createCase() {
  const name = (document.getElementById("newName").value || "").trim()
    || `Donor ${String.fromCharCode(65 + data.cases.length)} — 40M`;
  const hospital = (document.getElementById("newHospital")?.value || "").trim() || "Manual Entry";
  const risk = document.getElementById("newRisk").value;
  const status = document.getElementById("newStatus").value;
  const c = buildCase(name, risk, status, 0, 0, ["Manual entry — no EHR provenance"],
    { hospital, ehrSource: "Manual" });
  c.events.push({ t: Date.now(), text: "Case opened — manual entry", severity: "info" });
  c.auditChain.push({
    seq: 1, t: Date.now(),
    actor: "Coordinator",
    action: "Manual case creation",
    severity: "info",
    prevHash: "0".repeat(12),
    hash: pseudoHash((Date.now() ^ c.id) >>> 0)
  });
  addCaseInsight(c, `Manual case opened. Athena assessing ${risk.toLowerCase()}-risk profile. Note: no EHR provenance.`, risk === "High" ? "critical" : "warning");
  data.cases.push(c);
  navigate("case-detail", c.id);
}

    <div class="subhead">IMMUTABLE EVENT HISTORY · HASH-LINKED · SHA-256 EQUIVALENT</div>

    <div class="audit-controls">
      <input class="audit-search" id="auditSearch" placeholder="Filter by case, actor, action..." oninput="filterAuditLedger()"/>
      <button class="btn ghost" onclick="alert('Export → CSV / JSON / PDF')">Export</button>
      <button class="btn ghost" onclick="alert('Verify → Re-compute and validate hash chain')">Verify Chain</button>
    </div>

    <div class="optn-status-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      <div class="optn-tile">
        <div class="optn-tile-label">Total Events</div>
        <div class="optn-tile-value">${allEntries.length}</div>
        <div class="optn-tile-trend">across ${data.cases.length} cases</div>
      </div>
      <div class="optn-tile ok">
        <div class="optn-tile-label">Chain Integrity</div>
        <div class="optn-tile-value">VALID</div>
        <div class="optn-tile-trend">last verified just now</div>
      </div>
      <div class="optn-tile">
        <div class="optn-tile-label">Retention</div>
        <div class="optn-tile-value">7yr</div>
        <div class="optn-tile-trend">WORM · regulatory hold capable</div>
      </div>
      <div class="optn-tile">
        <div class="optn-tile-label">Last Export</div>
        <div class="optn-tile-value mono" style="font-size:14px">—</div>
        <div class="optn-tile-trend">never</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>Event Stream</span>
        <span class="mono" style="font-size:10px;color:var(--muted);text-transform:none;letter-spacing:0.06em">most recent first · click hash to inspect</span>
      </div>
      <div id="auditList">
        ${allEntries.map(e => auditRowHtml(e)).join("")}
      </div>
    </div>
  `;
}

function auditRowHtml(e) {
  return `
    <div class="audit-row ${e.severity || 'info'}" data-search="${escapeHtml((e.actor + ' ' + e.action + ' ' + e.caseName).toLowerCase())}">
      <div class="audit-seq mono">#${String(e.seq).padStart(3, '0')}</div>
      <div class="audit-time">${formatDateTime(e.t)}</div>
      <div class="audit-actor">${escapeHtml(e.actor)}</div>
      <div class="audit-action">${escapeHtml(e.action)}</div>
      <div class="audit-case-link" onclick="navigate('case-detail', ${e.caseId})">${escapeHtml(e.caseName.split(' — ')[0])} →</div>
      <div class="audit-hash" title="prev: ${e.prevHash}">
        <span class="audit-hash-link"></span>
        <span>${e.hash}</span>
      </div>
    </div>
  `;
}

function filterAuditLedger() {
  const q = (document.getElementById("auditSearch")?.value || "").toLowerCase();
  document.querySelectorAll("#auditList .audit-row").forEach(row => {
    const data = row.getAttribute("data-search") || "";
    row.style.display = (q === "" || data.includes(q)) ? "" : "none";
  });
}


/* =====================================================
   UTILITIES
   ===================================================== */
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function formatTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatDateTime(ts) {
  const d = new Date(ts);
  return `${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })} ${formatTime(ts)}`;
}
function formatElapsed(ms) {
  if (!ms || ms < 0) ms = 0;
  const min = Math.floor(ms / 60000);
  if (min < 1)  return "just now";
  if (min < 60) return `${min}m`;
  const hr = Math.floor(min / 60);
  return `${hr}h ${min % 60}m`;
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

/* Clock */
function updateClock() {
  const d = new Date();
  document.getElementById("clock").textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

/* Boot */
navigate("dashboard");

</script>
